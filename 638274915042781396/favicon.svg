<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --cp-bg: #f7f4ef;
      --cp-surface: #ffffff;
      --cp-text: #242424;
      --cp-accent: #b11f4b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cp-bg: #3d3b3a;
        --cp-surface: #292929;
        --cp-text: #dedede;
        --cp-accent: #fd8ea1;
      }
    }
    .book {
      fill: var(--cp-surface);
      stroke: var(--cp-text);
      stroke-linejoin: round;
      stroke-width: 2.5;
    }
    .thread {
      fill: none;
      stroke: var(--cp-accent);
      stroke-linecap: round;
      stroke-width: 3;
    }
    .node {
      fill: var(--cp-bg);
      stroke: var(--cp-accent);
      stroke-width: 3;
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--cp-bg)"/>
  <path class="book" d="M8 15h15c5 0 9 4 9 9v28c0-5-4-9-9-9H8V15Z"/>
  <path class="book" d="M56 15H41c-5 0-9 4-9 9v28c0-5 4-9 9-9h15V15Z"/>
  <path class="thread" d="M16 31c8-10 22 13 32 1"/>
  <circle class="node" cx="16" cy="31" r="3.5"/>
  <circle class="node" cx="48" cy="32" r="3.5"/>
</svg>
