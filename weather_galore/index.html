<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Galore</title>
<meta name="description" content="Weather Galore — current conditions and a 5-day forecast for any city, powered by Open-Meteo.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='12' r='6' fill='%23f5a524'/%3E%3Cpath d='M11 26a6 6 0 0 1 .6-12 8 8 0 0 1 15 2.6A5 5 0 0 1 26 26z' fill='%2390a4c4'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.14);
    --accent-ink: #7c4a03;

    --bg: #f4f6fa;
    --bg-glow: rgba(245, 158, 11, 0.18);
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e3e8ef;
    --border-strong: #cbd5e1;
    --text: #14181f;
    --muted: #5b6472;
    --soft: #7c8797;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px rgba(16, 24, 40, .08);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-glow: rgba(245, 158, 11, 0.14);
      --surface: #161b22;
      --surface-2: #1c222b;
      --border: #2a323d;
      --border-strong: #3a4552;
      --text: #e6edf3;
      --muted: #9aa7b6;
      --soft: #7d8a99;
      --accent-ink: #ffd79a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .38);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 28px 18px 44px;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background:
      radial-gradient(120% 70% at 50% -12%, var(--bg-glow), transparent 62%),
      var(--bg);
    transition: background .5s ease;
    -webkit-font-smoothing: antialiased;
  }

  @media (min-width: 560px) { body { font-size: 16px; } }

  .wrap {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- header ---------- */
  header { text-align: center; }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 1.34rem;
    font-weight: 700;
    letter-spacing: -0.022em;
  }
  .logo svg { width: 26px; height: 26px; display: block; }

  .tagline {
    margin: 5px 0 0;
    font-size: .85rem;
    color: var(--soft);
  }

  /* ---------- search ---------- */
  .search { position: relative; }

  form.search-row { display: flex; gap: 8px; }

  .field { position: relative; flex: 1 1 auto; min-width: 0; }

  .field svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--soft);
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    padding: 11px 13px 11px 35px;
    font: inherit;
    font-size: .95rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    box-shadow: var(--shadow);
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    appearance: none;
  }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  input[type="search"]::placeholder { color: var(--soft); }
  input[type="search"]:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button {
    font: inherit;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 11px;
    border: 1px solid transparent;
    transition: transform .12s, filter .18s, background .3s, border-color .3s;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }

  .btn-go {
    padding: 11px 17px;
    color: #fff;
    background: var(--accent);
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .btn-go:hover { filter: brightness(1.06); }
  @media (prefers-color-scheme: dark) { .btn-go { color: #10141a; } }

  /* ---------- suggestions ---------- */
  .suggest {
    position: absolute;
    z-index: 40;
    top: calc(100% + 6px);
    left: 0; right: 0;
    margin: 0; padding: 5px;
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    max-height: 264px;
    overflow-y: auto;
  }
  .suggest[hidden] { display: none; }
  .suggest li {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--accent-soft); }
  .suggest .place { font-weight: 600; }
  .suggest .region { color: var(--soft); font-size: .8rem; text-align: right; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .current {
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .current::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-soft), transparent 58%);
    pointer-events: none;
  }
  .current > * { position: relative; }

  .place-name {
    margin: 0;
    font-size: 1.06rem;
    font-weight: 650;
    letter-spacing: -0.012em;
  }
  .place-sub {
    margin: 2px 0 0;
    font-size: .82rem;
    color: var(--soft);
  }

  .now {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .now-icon {
    flex: none;
    width: 58px; height: 58px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .now-icon svg { width: 36px; height: 36px; }

  .temp {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
  }
  .temp sup { font-size: .38em; font-weight: 600; vertical-align: super; margin-left: 2px; }

  .cond { margin-top: 3px; font-size: .93rem; font-weight: 600; color: var(--accent-ink); }
  @media (prefers-color-scheme: dark) { .cond { color: var(--accent); } }

  .stats {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    text-align: center;
  }
  .stats dt { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
  .stats dd { margin: 3px 0 0; font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- forecast ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 2px;
  }
  h2 {
    margin: 0;
    font-size: .74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--soft);
  }

  .unit-toggle {
    display: inline-flex;
    padding: 2px;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .unit-toggle button {
    padding: 3px 9px;
    font-size: .76rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border-radius: 7px;
    box-shadow: none;
  }
  .unit-toggle button[aria-pressed="true"] {
    color: #fff;
    background: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    .unit-toggle button[aria-pressed="true"] { color: #10141a; }
  }

  .forecast {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }
  @media (max-width: 430px) {
    .forecast { grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); }
  }

  .day {
    padding: 12px 6px 13px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    transition: transform .16s ease, border-color .3s;
  }
  .day:hover { transform: translateY(-2px); border-color: var(--border-strong); }
  .day .dow { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .day .date { font-size: .68rem; color: var(--soft); margin-top: -6px; }
  .day svg { width: 27px; height: 27px; color: var(--accent); }
  .day .hi { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day .lo { font-size: .8rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .day .pop {
    font-size: .68rem;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 1px 6px;
    border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) { .day .pop { color: var(--accent); } }
  .day .pop[hidden] { display: none; }

  /* ---------- status ---------- */
  .note {
    margin: 0;
    font-size: .78rem;
    color: var(--soft);
    text-align: center;
  }
  .note a { color: inherit; }

  .banner {
    padding: 9px 13px;
    font-size: .82rem;
    border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
  }
  .banner[hidden] { display: none; }

  .is-loading { opacity: .5; transition: opacity .2s; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="12" cy="12" r="6" fill="#f5a524"/>
        <path d="M11 26a6 6 0 0 1 .6-12 8 8 0 0 1 15 2.6A5 5 0 0 1 26 26z" fill="#90a4c4"/>
      </svg>
      <span>Weather Galore</span>
    </div>
    <p class="tagline">Current conditions and a 5-day outlook, anywhere.</p>
  </header>

  <div class="search">
    <form class="search-row" id="form" role="search" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <label class="sr-only" for="q">Search for a city</label>
        <input id="q" type="search" placeholder="Search a city — try Denver or Paris"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
      </div>
      <button class="btn-go" type="submit">Search</button>
    </form>
    <ul class="suggest" id="suggest" role="listbox" aria-label="City suggestions" hidden></ul>
  </div>

  <p class="banner" id="banner" role="status" hidden></p>

  <section class="card current" id="current" aria-live="polite">
    <h1 class="place-name" id="placeName">Loading…</h1>
    <p class="place-sub" id="placeSub">Fetching the latest conditions</p>
    <div class="now">
      <div class="now-icon" id="nowIcon"></div>
      <div>
        <div class="temp" id="temp">--<sup>°F</sup></div>
        <div class="cond" id="cond">—</div>
      </div>
    </div>
    <dl class="stats">
      <div><dt>Feels like</dt><dd id="feels">—</dd></div>
      <div><dt>Humidity</dt><dd id="hum">—</dd></div>
      <div><dt>Wind</dt><dd id="wind">—</dd></div>
      <div><dt>Rain</dt><dd id="pop">—</dd></div>
    </dl>
  </section>

  <div class="section-head">
    <h2>5-day forecast</h2>
    <div class="unit-toggle" role="group" aria-label="Temperature units">
      <button type="button" id="btnF" aria-pressed="true">°F</button>
      <button type="button" id="btnC" aria-pressed="false">°C</button>
    </div>
  </div>

  <ul class="forecast" id="forecast"></ul>

  <p class="note" id="note">Live data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.</p>

</div>

<script>
(() => {
  "use strict";

  /* ---------------- icons ---------------- */
  const S = (inner) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

  const CLOUD = '<path d="M7.5 19a4.5 4.5 0 0 1 .4-9 6 6 0 0 1 11.4 2 3.5 3.5 0 0 1-.3 7z"/>';
  const ICONS = {
    sun: S('<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/>'),
    moon: S('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'),
    partly: S('<path d="M8.6 5.2V3.4M4.4 6.9 3.2 5.7M13.9 6.9l1.2-1.2M4 11H2.4"/><circle cx="8.6" cy="11" r="3.1"/>' + CLOUD),
    partlyNight: S('<path d="M15.6 3.2a4.6 4.6 0 0 0 5.2 6.4 5 5 0 1 1-5.2-6.4z"/>' + CLOUD),
    cloud: S(CLOUD),
    fog: S('<path d="M7.5 15.5a4.4 4.4 0 0 1 .4-8.6 6 6 0 0 1 11.2 1.9 3.4 3.4 0 0 1 .1 6.7"/><path d="M4 18.5h16M6.5 21.5h11"/>'),
    drizzle: S(CLOUD + '<path d="M9 21v1.2M13 20.6v1.2M17 21v1.2"/>'),
    rain: S(CLOUD + '<path d="M8.6 20.4 7.6 23M12.6 20.4l-1 2.6M16.6 20.4l-1 2.6"/>'),
    snow: S(CLOUD + '<path d="M8.5 21h.01M12 22.2h.01M15.5 21h.01M10.2 22.6h.01M13.8 22.6h.01"/>'),
    sleet: S(CLOUD + '<path d="M8.6 20.4 7.6 23M12.5 21.2h.01M16.6 20.4l-1 2.6"/>'),
    thunder: S(CLOUD + '<path d="M13 19.4 10 23h3.6L11.6 26"/>'),
  };

  /* ---------------- WMO weather codes ---------------- */
  // [label, icon key, night icon key, accent hex]
  const CODES = {
    0:  ["Clear sky",           "sun",     "moon",        "#f59e0b"],
    1:  ["Mainly clear",        "sun",     "moon",        "#f0a92c"],
    2:  ["Partly cloudy",       "partly",  "partlyNight", "#3b9ae1"],
    3:  ["Overcast",            "cloud",   "cloud",       "#64748b"],
    45: ["Fog",                 "fog",     "fog",         "#78889c"],
    48: ["Freezing fog",        "fog",     "fog",         "#6d8497"],
    51: ["Light drizzle",       "drizzle", "drizzle",     "#4d9fd6"],
    53: ["Drizzle",             "drizzle", "drizzle",     "#3f93cd"],
    55: ["Heavy drizzle",       "drizzle", "drizzle",     "#3487c4"],
    56: ["Freezing drizzle",    "sleet",   "sleet",       "#4aa8c9"],
    57: ["Freezing drizzle",    "sleet",   "sleet",       "#4aa8c9"],
    61: ["Light rain",          "rain",    "rain",        "#3b82f6"],
    63: ["Rain",                "rain",    "rain",        "#2f6fdc"],
    65: ["Heavy rain",          "rain",    "rain",        "#2563eb"],
    66: ["Freezing rain",       "sleet",   "sleet",       "#4593c9"],
    67: ["Freezing rain",       "sleet",   "sleet",       "#4593c9"],
    71: ["Light snow",          "snow",    "snow",        "#5eb8d8"],
    73: ["Snow",                "snow",    "snow",        "#4dabcf"],
    75: ["Heavy snow",          "snow",    "snow",        "#3f9fc6"],
    77: ["Snow grains",         "snow",    "snow",        "#5eb8d8"],
    80: ["Light showers",       "rain",    "rain",        "#3d8ce0"],
    81: ["Showers",             "rain",    "rain",        "#3080d8"],
    82: ["Heavy showers",       "rain",    "rain",        "#2670cf"],
    85: ["Snow showers",        "snow",    "snow",        "#4dabcf"],
    86: ["Heavy snow showers",  "snow",    "snow",        "#3f9fc6"],
    95: ["Thunderstorm",        "thunder", "thunder",     "#8b5cf6"],
    96: ["Thunderstorm, hail",  "thunder", "thunder",     "#7c4ef0"],
    99: ["Severe thunderstorm", "thunder", "thunder",     "#6d3fe6"],
  };

  const codeInfo = (c) => CODES[c] || ["Unknown", "cloud", "cloud", "#64748b"];

  /* ---------------- fallback (used only if the network fails) ---------------- */
  const nextDays = (n) => Array.from({ length: n }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() + i);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  });

  const FALLBACK = {
    place: { name: "Goodyear", admin1: "Arizona", country: "United States", latitude: 33.4353, longitude: -112.3576 },
    current: { temperature_2m: 34.4, apparent_temperature: 33.1, relative_humidity_2m: 18,
               wind_speed_10m: 12.4, weather_code: 0, is_day: 1 },
    daily: {
      time: nextDays(5),
      weather_code: [0, 1, 2, 95, 3],
      temperature_2m_max: [41.1, 42.2, 40.0, 37.8, 38.9],
      temperature_2m_min: [27.2, 28.3, 27.8, 26.1, 26.7],
      precipitation_probability_max: [0, 0, 10, 45, 20],
    },
  };

  /* ---------------- elements ---------------- */
  const $ = (id) => document.getElementById(id);
  const el = {
    form: $("form"), q: $("q"), suggest: $("suggest"), banner: $("banner"),
    current: $("current"), placeName: $("placeName"), placeSub: $("placeSub"),
    nowIcon: $("nowIcon"), temp: $("temp"), cond: $("cond"),
    feels: $("feels"), hum: $("hum"), wind: $("wind"), pop: $("pop"),
    forecast: $("forecast"), note: $("note"), btnF: $("btnF"), btnC: $("btnC"),
  };

  /* ---------------- state ---------------- */
  const DEFAULT_PLACE = FALLBACK.place;
  const store = {
    get(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch { return fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
  };

  let unit = store.get("wg.unit", "F") === "C" ? "C" : "F";
  let place = store.get("wg.place", null) || DEFAULT_PLACE;
  let data = null;          // last successful (or fallback) payload, always in °C
  let activeIndex = -1;
  let matches = [];
  let reqToken = 0;

  /* ---------------- helpers ---------------- */
  const toUnit = (c) => (unit === "F" ? c * 9 / 5 + 32 : c);
  const showTemp = (c) => (c === null || c === undefined || Number.isNaN(c) ? "—" : `${Math.round(toUnit(c))}°`);
  const kmhToMph = (k) => k * 0.621371;

  const placeLabel = (p) => [p.name, p.admin1, p.country].filter(Boolean).join(", ");

  function setAccent(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const root = document.documentElement.style;
    root.setProperty("--accent", hex);
    root.setProperty("--accent-soft", `rgba(${r}, ${g}, ${b}, 0.15)`);
    root.setProperty("--bg-glow", `rgba(${r}, ${g}, ${b}, 0.2)`);
    root.setProperty("--accent-ink", `rgb(${Math.round(r * .58)}, ${Math.round(g * .5)}, ${Math.round(b * .5)})`);
    const meta = document.querySelector('meta[name="theme-color"]') || (() => {
      const m = document.createElement("meta"); m.name = "theme-color";
      document.head.appendChild(m); return m;
    })();
    meta.content = hex;
  }

  function banner(msg) {
    if (!msg) { el.banner.hidden = true; el.banner.textContent = ""; return; }
    el.banner.hidden = false;
    el.banner.textContent = msg;
  }

  const fetchJSON = async (url, ms = 8000) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally { clearTimeout(timer); }
  };

  /* ---------------- rendering ---------------- */
  function render() {
    if (!data) return;
    const cur = data.current, daily = data.daily, p = data.place;
    const night = cur.is_day === 0;
    const [label, dayIcon, nightIcon, hex] = codeInfo(cur.weather_code);

    setAccent(hex);

    el.placeName.textContent = p.name + (p.admin1 ? `, ${p.admin1}` : "");
    el.placeSub.textContent = [p.country, new Date().toLocaleDateString(undefined,
      { weekday: "long", month: "long", day: "numeric" })].filter(Boolean).join(" · ");

    el.nowIcon.innerHTML = ICONS[night ? nightIcon : dayIcon];
    el.temp.innerHTML = `${Math.round(toUnit(cur.temperature_2m))}<sup>°${unit}</sup>`;
    el.cond.textContent = label;

    el.feels.textContent = showTemp(cur.apparent_temperature);
    el.hum.textContent = cur.relative_humidity_2m != null ? `${Math.round(cur.relative_humidity_2m)}%` : "—";
    el.wind.textContent = cur.wind_speed_10m != null
      ? (unit === "F" ? `${Math.round(kmhToMph(cur.wind_speed_10m))} mph` : `${Math.round(cur.wind_speed_10m)} km/h`)
      : "—";
    const todayPop = daily.precipitation_probability_max?.[0];
    el.pop.textContent = todayPop != null ? `${Math.round(todayPop)}%` : "—";

    el.forecast.innerHTML = daily.time.slice(0, 5).map((iso, i) => {
      const d = new Date(`${iso}T12:00:00`);
      const [dLabel, dIcon] = codeInfo(daily.weather_code[i]);
      const pop = daily.precipitation_probability_max?.[i];
      return `<li class="card day" title="${dLabel}">
          <span class="dow">${i === 0 ? "Today" : d.toLocaleDateString(undefined, { weekday: "short" })}</span>
          <span class="date">${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
          ${ICONS[dIcon]}
          <span class="hi">${showTemp(daily.temperature_2m_max[i])}</span>
          <span class="lo">${showTemp(daily.temperature_2m_min[i])}</span>
          <span class="pop"${pop >= 10 ? "" : " hidden"}>${Math.round(pop || 0)}%</span>
        </li>`;
    }).join("");

    el.current.classList.remove("is-loading");
    el.forecast.classList.remove("is-loading");
  }

  /* ---------------- data ---------------- */
  async function loadWeather(p) {
    const token = ++reqToken;
    el.current.classList.add("is-loading");
    el.forecast.classList.add("is-loading");
    banner("");

    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${p.latitude}&longitude=${p.longitude}`
      + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=auto&forecast_days=5";

    try {
      const json = await fetchJSON(url);
      if (token !== reqToken) return;
      if (!json.current || !json.daily) throw new Error("Malformed response");
      data = { place: p, current: json.current, daily: json.daily };
      el.note.innerHTML = 'Live data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. '
        + `Updated ${new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}.`;
      store.set("wg.place", p);
    } catch (err) {
      if (token !== reqToken) return;
      data = { place: FALLBACK.place, current: FALLBACK.current, daily: FALLBACK.daily };
      banner("Couldn't reach the weather service — showing saved sample data for Goodyear, AZ.");
      el.note.textContent = "Offline sample data. Check your connection and search again.";
    }
    render();
  }

  async function geocode(name, limit = 6) {
    const url = "https://geocoding-api.open-meteo.com/v1/search"
      + `?name=${encodeURIComponent(name)}&count=${limit}&language=en&format=json`;
    const json = await fetchJSON(url, 6000);
    return (json.results || []).map((r) => ({
      name: r.name, admin1: r.admin1, country: r.country,
      latitude: r.latitude, longitude: r.longitude,
    }));
  }

  /* ---------------- suggestions ---------------- */
  function closeSuggest() {
    el.suggest.hidden = true;
    el.suggest.innerHTML = "";
    el.q.setAttribute("aria-expanded", "false");
    activeIndex = -1;
    matches = [];
  }

  function openSuggest(results) {
    matches = results;
    if (!results.length) return closeSuggest();
    el.suggest.innerHTML = results.map((r, i) =>
      `<li role="option" id="opt-${i}" aria-selected="false" data-i="${i}">
         <span class="place">${r.name}</span>
         <span class="region">${[r.admin1, r.country].filter(Boolean).join(", ")}</span>
       </li>`).join("");
    el.suggest.hidden = false;
    el.q.setAttribute("aria-expanded", "true");
    activeIndex = -1;
  }

  function highlight(i) {
    const items = [...el.suggest.children];
    items.forEach((li, n) => li.setAttribute("aria-selected", n === i ? "true" : "false"));
    activeIndex = i;
    if (items[i]) items[i].scrollIntoView({ block: "nearest" });
  }

  function choose(i) {
    const p = matches[i];
    if (!p) return;
    place = p;
    el.q.value = placeLabel(p);
    closeSuggest();
    el.q.blur();
    loadWeather(p);
  }

  let debounce;
  el.q.addEventListener("input", () => {
    clearTimeout(debounce);
    const term = el.q.value.trim();
    if (term.length < 2) return closeSuggest();
    debounce = setTimeout(async () => {
      try { openSuggest(await geocode(term)); } catch { closeSuggest(); }
    }, 250);
  });

  el.q.addEventListener("keydown", (e) => {
    if (el.suggest.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); highlight((activeIndex + 1) % matches.length); }
    else if (e.key === "ArrowUp") { e.preventDefault(); highlight((activeIndex - 1 + matches.length) % matches.length); }
    else if (e.key === "Escape") closeSuggest();
    else if (e.key === "Enter" && activeIndex >= 0) { e.preventDefault(); choose(activeIndex); }
  });

  el.suggest.addEventListener("mousedown", (e) => {
    const li = e.target.closest("li[data-i]");
    if (li) { e.preventDefault(); choose(Number(li.dataset.i)); }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search")) closeSuggest();
  });

  /* ---------------- search submit ---------------- */
  el.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const term = el.q.value.trim();
    if (!term) return;
    if (activeIndex >= 0) return choose(activeIndex);
    closeSuggest();
    try {
      const results = await geocode(term, 1);
      if (!results.length) return banner(`No city found for “${term}”. Try a different spelling.`);
      place = results[0];
      el.q.value = placeLabel(place);
      el.q.blur();
      loadWeather(place);
    } catch {
      banner("Search is unavailable right now — check your connection.");
    }
  });

  /* ---------------- units ---------------- */
  function setUnit(u) {
    unit = u;
    store.set("wg.unit", u);
    el.btnF.setAttribute("aria-pressed", String(u === "F"));
    el.btnC.setAttribute("aria-pressed", String(u === "C"));
    render();
  }
  el.btnF.addEventListener("click", () => setUnit("F"));
  el.btnC.addEventListener("click", () => setUnit("C"));

  /* ---------------- boot ---------------- */
  setUnit(unit);
  el.q.value = placeLabel(place);
  loadWeather(place);

  // Refresh when the tab regains focus after a few minutes.
  let lastLoad = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 5 * 60 * 1000) {
      lastLoad = Date.now();
      loadWeather(place);
    }
  });
})();
</script>
</body>
</html>
