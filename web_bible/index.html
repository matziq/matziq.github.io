<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read and search the full text of the World English Bible (WEB), a public-domain modern-English translation.">
  <title>World English Bible</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
  </style>
  <link rel="stylesheet" href="../collections.css">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="reader-brand" href="../bible_resources/">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span><strong>World English Bible</strong><small>Full text &amp; search</small></span>
      </a>
      <form class="search-form" id="search-form" role="search">
        <input type="search" id="search-input" name="q" placeholder="Search the Bible (e.g. love your neighbor)" aria-label="Search the Bible">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>
  <div class="reader-shell">
    <aside class="reader-nav">
      <h2>Browse</h2>
      <div class="nav-selects">
        <select id="book-select" aria-label="Select book"></select>
      </div>
      <div class="chapter-grid" id="chapter-grid" aria-label="Select chapter"></div>
    </aside>
    <main class="reader-main">
      <div class="reader-toolbar">
        <h1 id="toolbar-title">Loading&hellip;</h1>
        <div class="toolbar-nav">
          <button type="button" id="prev-chapter" aria-label="Previous chapter">&larr; Prev</button>
          <button type="button" id="next-chapter" aria-label="Next chapter">Next &rarr;</button>
        </div>
      </div>
      <div id="reader-body"><p class="loading-note">Loading Bible text&hellip;</p></div>
    </main>
  </div>
  <footer><a href="../bible_resources/">&larr; Bible Resources</a><span>World English Bible</span></footer>
  <script src="./assets/app.js"></script>
</body>
</html>
