name: Refresh GTA VI news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_gtavi_news.py'
      - '.github/workflows/gtavi-news.yml'

permissions:
  contents: write

concurrency:
  group: gtavi-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape latest Featured News
        run: python scripts/fetch_gtavi_news.py

      - name: Commit updated feed
        run: |
          if [ -z "$(git status --porcelain gtavi_countdown/news.json)" ]; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtavi_countdown/news.json
          git commit -m "chore: refresh GTA VI news feed"
          git push
