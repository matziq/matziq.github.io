<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Generic standalone theme. The source page's SharePoint dark theme override (data-sp-site-theme) is intentionally omitted: it was host-injected and unused by the page's own CSS. -->
<style>
:root{--brand:{{BRAND}};--accent:{{ACCENT}};--band:#e3e9f1}
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f5f6f8;color:#1b1b1b}
header{background:var(--brand);color:#fff;padding:28px 40px}header h1{margin:0 0 6px;font-size:26px}header p{margin:0}
sup{line-height:0}
main{padding:24px 40px;max-width:1300px;margin:auto}
h2{margin-top:36px}
h3{margin:26px 0 6px;color:var(--brand)}.sub{color:#555;font-size:14px;margin:0 0 10px}
.toc{background:#fff;border:1px solid #e0e3e8;border-radius:6px;padding:10px 18px;font-size:14px}.toc a{color:var(--brand)}.toc ul{margin:6px 0;padding-left:18px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #e6e8ec;font-size:14px;vertical-align:top}th{background:var(--band)}
.detail td:first-child{width:26%;font-weight:600}.detail td:nth-child(2){width:14%}.detail td:nth-child(3){width:14%;white-space:nowrap}.detail td:nth-child(4){width:10%;white-space:nowrap}
.note{font-size:12.5px;color:#666;margin-top:14px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--band);color:var(--brand);margin-left:6px;font-weight:600}
.callout{background:#fff;border-left:4px solid var(--accent);padding:10px 14px;margin:14px 0;font-size:14px;border-radius:4px}
@media (max-width:700px){header,main{padding:16px}.detail td:first-child,.detail td:nth-child(n){width:auto}}
@media print{body{background:#fff}table,.callout{page-break-inside:avoid;break-inside:avoid}.toc{display:none}}
</style></head><body>
<header><h1>{{TITLE}}</h1><p>{{SUBTITLE}}</p></header>
<main>
{{TOC}}
{{BODY}}
</main></body></html>
