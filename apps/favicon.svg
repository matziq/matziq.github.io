<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #242424; }
    .tile { fill: #b11f4b; }
    .tile-alt { fill: #f7f4ef; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #dedede; }
      .tile { fill: #fd8ea1; }
      .tile-alt { fill: #292929; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <rect class="tile" x="14" y="14" width="15" height="15" rx="3"/>
  <rect class="tile-alt" x="35" y="14" width="15" height="15" rx="3"/>
  <rect class="tile-alt" x="14" y="35" width="15" height="15" rx="3"/>
  <rect class="tile" x="35" y="35" width="15" height="15" rx="3"/>
</svg>
