<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Drills &mdash; GH-300 Exam Prep</title>
<meta name="description" content="Eighteen short timed Microsoft GH-300 drills on one skill at a time.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar"></header>
<main id="main"><div class="wrap"><div id="head"><h1>Topic Drills</h1><p class="lede">One skill, one short set, on the clock. Use drills between practice exams to fix something specific.</p></div><div id="list"></div><div id="app"></div></div></main>
<footer id="footer"></footer>
<script src="assets/data/drills.js"></script>
<script src="assets/test-engine.js"></script>
<script>
(function () {
    function param(k) { var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search); return m ? decodeURIComponent(m[1]) : null; }
    var FALLBACK = [
        {id:"d1-principles",title:"Responsible AI Principles",domain:"responsibly"},{id:"d1-limitations",title:"Limitations and Risks",domain:"responsibly"},{id:"d1-bias",title:"Bias, Fairness, and Mitigation",domain:"responsibly"},{id:"d1-verification",title:"Verification and Human Oversight",domain:"responsibly"},
        {id:"d2-completions",title:"Completions and Next Edit Suggestions",domain:"features"},{id:"d2-modes",title:"Ask, Edit, and Agent Mode",domain:"features"},{id:"d2-chat",title:"Chat Interfaces and Commands",domain:"features"},{id:"d2-cloud-agent",title:"Cloud Agent and Code Review",domain:"features"},{id:"d2-platform",title:"Platform Features and Replacements",domain:"features"},{id:"d2-mcp",title:"MCP and Extensibility",domain:"features"},
        {id:"d3-dataflow",title:"The Seven-Step Request Lifecycle",domain:"architecture"},{id:"d3-retention",title:"Retention and Training Data",domain:"architecture"},{id:"d4-fundamentals",title:"Prompt Fundamentals and the 4 Ss",domain:"prompting"},{id:"d4-context",title:"Context Crafting and Custom Instructions",domain:"prompting"},
        {id:"d5-workflow",title:"Copilot Across the SDLC",domain:"productivity"},{id:"d5-metrics",title:"Metrics and Measuring Impact",domain:"productivity"},{id:"d6-exclusions",title:"Content Exclusions and Public Code Matching",domain:"privacy"},{id:"d6-policies",title:"Plans, Policies, and Indemnity",domain:"privacy"}
    ];
    function sets() { var s = (window.GH3_DATA && window.GH3_DATA.drills) || []; return s.length ? s : FALLBACK; }
    function bestFor(id) { return GH3.store.get("drillScores", {})[id] || null; }
    function domainFor(set) { if (set.domain) return GH3.domainById(set.domain); var t = GH3.topicByName(set.topic); return t ? GH3.domainById(t.domain) : null; }
    document.addEventListener("DOMContentLoaded", function () {
        var all = sets(), want = param("set");
        if (want) {
            var found = null; for (var i = 0; i < all.length; i++) if (all[i].id === want) found = all[i];
            if (found && found.questions && found.questions.length) { document.getElementById("head").innerHTML = '<p class="no-print"><a href="drills.html">&larr; All drills</a></p><h1>' + GH3.escapeHtml(found.title) + '</h1><p class="lede">' + (found.blurb || "") + '</p>'; document.getElementById("list").innerHTML = ""; GH3.Test.mountDrill({ el: document.getElementById("app"), drillId: want }); return; }
            document.getElementById("head").innerHTML = '<p><a href="drills.html">&larr; All drills</a></p><h1>' + (found ? GH3.escapeHtml(found.title) : "Drill not found") + '</h1>';
            document.getElementById("app").innerHTML = '<div class="card"><h3>Question data not loaded</h3><p>This launcher exists, but the drill question data file has not loaded yet.</p></div>';
            return;
        }
        var html = '<div class="callout tip"><span class="callout-title">How to use a drill</span><p>Do the whole set on the clock without checking anything. Then read every explanation, including the ones you got right.</p><p style="margin-bottom:0">Anything you miss goes in the <a href="tools.html#errorlog">error log</a>, then you re-drill that set two days later.</p></div>';
        var totalQ = 0;
        for (var d = 0; d < GH3.DOMAINS.length; d++) {
            var dm = GH3.DOMAINS[d], group = [];
            for (var s = 0; s < all.length; s++) { var gdm = domainFor(all[s]); if (gdm && gdm.id === dm.id) group.push(all[s]); }
            if (!group.length) continue;
            html += '<h2 style="margin-top:2.4rem">' + dm.num + '. ' + dm.name + ' <span class="badge ' + (dm.cls || "") + '">' + dm.weight + ' of the exam</span></h2><div class="grid grid-3">';
            for (var i2 = 0; i2 < group.length; i2++) { var set = group[i2], qn = set.questions ? set.questions.length : 0; totalQ += qn; var prev = bestFor(set.id); var badge = prev ? '<span class="badge ' + (prev.pct >= 85 ? "good" : (prev.pct >= 60 ? "amber" : "bad")) + '">Best ' + prev.right + '/' + prev.total + '</span>' : ''; html += '<a class="card card-link" href="drills.html?set=' + set.id + '"><div class="card-icon ' + (dm.cls || "") + '">' + (qn || "D") + '</div><h3>' + GH3.escapeHtml(set.title) + ' ' + badge + '</h3><p>' + (set.blurb || 'Focused review for this GH-300 objective.') + '</p><p class="faint" style="margin-bottom:0"><small>' + (qn ? qn + ' questions' : 'Questions load from assets/data/drills.js') + ' &middot; ' + (set.timeMinutes || 10) + ' minutes</small></p></a>'; }
            html += '</div>';
        }
        document.getElementById("list").innerHTML = '<p class="muted">' + all.length + ' drill sets' + (totalQ ? ' &middot; ' + totalQ + ' questions in total' : '') + '.</p>' + html;
    });
})();
</script>
</body>
</html>
