<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Drills &mdash; AB-100 Exam Prep</title>
<meta name="description" content="Eighteen short timed Microsoft AB-100 drills on one skill at a time.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar"></header>
<main id="main"><div class="wrap"><div id="head"><h1>Topic Drills</h1><p class="lede">One skill, one short set, on the clock. Use drills between practice exams to fix something specific.</p></div><div id="list"></div><div id="app"></div></div></main>
<footer id="footer"></footer>
<script src="assets/data/drills.js"></script>
<script src="assets/test-engine.js"></script>
<script>
(function () {
    function param(k) { var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search); return m ? decodeURIComponent(m[1]) : null; }
    var FALLBACK = [
        {id:"d1-requirements",title:"Requirements and Grounding Data",domain:"plan"},
        {id:"d1-adoption",title:"Adoption Strategy and the AI CoE",domain:"plan"},
        {id:"d1-multiagent",title:"Multi-Agent and Extend-or-Build",domain:"plan"},
        {id:"d1-knowledge",title:"Knowledge, Rules, and Custom Models",domain:"plan"},
        {id:"d1-prompts",title:"Prompt Libraries and Small Models",domain:"plan"},
        {id:"d1-roi",title:"ROI and Total Cost of Ownership",domain:"plan"},
        {id:"d1-build-buy",title:"Build, Buy, Extend, and Model Routing",domain:"plan"},
        {id:"d2-dynamics-cx",title:"Copilot in Dynamics 365 CX and Service",domain:"design"},
        {id:"d2-agent-types",title:"Agent Types, Topics, and Orchestration",domain:"design"},
        {id:"d2-apps-data",title:"Foundry Tools, Apps, and Grounding Data",domain:"design"},
        {id:"d2-studio-ext",title:"MCP, Computer Use, and Agent Behaviors",domain:"design"},
        {id:"d2-m365-foundry",title:"Microsoft 365 Agents and Foundry Models",domain:"design"},
        {id:"d2-prebuilt",title:"Prebuilt Agents and Dynamics 365 AI",domain:"design"},
        {id:"d3-monitor",title:"Monitoring, Telemetry, and Tuning",domain:"deploy"},
        {id:"d3-testing",title:"Testing and Validation",domain:"deploy"},
        {id:"d3-alm",title:"ALM for Agents, Models, and Data",domain:"deploy"},
        {id:"d3-security",title:"Agent and Model Security",domain:"deploy"},
        {id:"d3-governance",title:"Governance, Compliance, and Responsible AI",domain:"deploy"},{id:"d6-policies",title:"Plans, Policies, and Indemnity",domain:"privacy"}
    ];
    function sets() { var s = (window.AB1_DATA && window.AB1_DATA.drills) || []; return s.length ? s : FALLBACK; }
    function bestFor(id) { return AB1.store.get("drillScores", {})[id] || null; }
    function domainFor(set) { if (set.domain) return AB1.domainById(set.domain); var t = AB1.topicByName(set.topic); return t ? AB1.domainById(t.domain) : null; }
    document.addEventListener("DOMContentLoaded", function () {
        var all = sets(), want = param("set");
        if (want) {
            var found = null; for (var i = 0; i < all.length; i++) if (all[i].id === want) found = all[i];
            if (found && found.questions && found.questions.length) { document.getElementById("head").innerHTML = '<p class="no-print"><a href="drills.html">&larr; All drills</a></p><h1>' + AB1.escapeHtml(found.title) + '</h1><p class="lede">' + (found.blurb || "") + '</p>'; document.getElementById("list").innerHTML = ""; AB1.Test.mountDrill({ el: document.getElementById("app"), drillId: want }); return; }
            document.getElementById("head").innerHTML = '<p><a href="drills.html">&larr; All drills</a></p><h1>' + (found ? AB1.escapeHtml(found.title) : "Drill not found") + '</h1>';
            document.getElementById("app").innerHTML = '<div class="card"><h3>Question data not loaded</h3><p>This launcher exists, but the drill question data file has not loaded yet.</p></div>';
            return;
        }
        var html = '<div class="callout tip"><span class="callout-title">How to use a drill</span><p>Do the whole set on the clock without checking anything. Then read every explanation, including the ones you got right.</p><p style="margin-bottom:0">Anything you miss goes in the <a href="tools.html#errorlog">error log</a>, then you re-drill that set two days later.</p></div>';
        var totalQ = 0;
        for (var d = 0; d < AB1.DOMAINS.length; d++) {
            var dm = AB1.DOMAINS[d], group = [];
            for (var s = 0; s < all.length; s++) { var gdm = domainFor(all[s]); if (gdm && gdm.id === dm.id) group.push(all[s]); }
            if (!group.length) continue;
            html += '<h2 style="margin-top:2.4rem">' + dm.num + '. ' + dm.name + ' <span class="badge ' + (dm.cls || "") + '">' + dm.weight + ' of the exam</span></h2><div class="grid grid-3">';
            for (var i2 = 0; i2 < group.length; i2++) { var set = group[i2], qn = set.questions ? set.questions.length : 0; totalQ += qn; var prev = bestFor(set.id); var badge = prev ? '<span class="badge ' + (prev.pct >= 85 ? "good" : (prev.pct >= 60 ? "amber" : "bad")) + '">Best ' + prev.right + '/' + prev.total + '</span>' : ''; html += '<a class="card card-link" href="drills.html?set=' + set.id + '"><div class="card-icon ' + (dm.cls || "") + '">' + (qn || "D") + '</div><h3>' + AB1.escapeHtml(set.title) + ' ' + badge + '</h3><p>' + (set.blurb || 'Focused review for this AB-100 objective.') + '</p><p class="faint" style="margin-bottom:0"><small>' + (qn ? qn + ' questions' : 'Questions load from assets/data/drills.js') + ' &middot; ' + (set.timeMinutes || 10) + ' minutes</small></p></a>'; }
            html += '</div>';
        }
        document.getElementById("list").innerHTML = '<p class="muted">' + all.length + ' drill sets' + (totalQ ? ' &middot; ' + totalQ + ' questions in total' : '') + '.</p>' + html;
    });
})();
</script>
</body>
</html>
